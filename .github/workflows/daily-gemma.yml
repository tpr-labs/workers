
      - name: Generate daily insight
        run: |
          set -euo pipefail

          cat > /tmp/request.json <<'JSON'
          {
            "model": "gemma4:e2b-it-q4_K_M",
            "prompt": "Generate a concise software engineer dashboard insight. Return a JSON object with exactly four non-empty string fields: quote, theme, engineering_tip, coding_challenge. The challenge should take about 10 minutes. Return valid JSON only.",
            "format": "json",
            "stream": false,
            "options": {
              "temperature": 0.7,
              "num_predict": 300,
              "num_ctx": 2048
            }
          }
          JSON

          echo "Generating with Ollama..."

          if ! curl -fsS \
            --max-time 600 \
            http://localhost:11434/api/generate \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/request.json \
            -o /tmp/response.json; then
            echo "Ollama API request failed."
            cat /tmp/response.json 2>/dev/null || true
            cat /tmp/ollama.log || true
            exit 1
          fi

          echo "=== Ollama response metadata ==="
          jq '{
            error: .error,
            done: .done,
            total_duration: .total_duration,
            eval_count: .eval_count,
            response_type: (.response | type),
            response_length: ((.response // "") | tostring | length)
          }' /tmp/response.json

          if jq -e '.error != null' /tmp/response.json >/dev/null; then
            echo "Ollama returned an error:"
            jq -r '.error' /tmp/response.json
            exit 1
          fi

          # Ollama's format=json returns generated JSON as a string.
          # Handle either that format or a direct JSON object.
          jq -e '
            if (.response | type) == "string" then
              .response | fromjson
            elif (.response | type) == "object" then
              .response
            else
              error("Missing or invalid response field")
            end
          ' /tmp/response.json > daily.json || {
            echo "Could not parse generated JSON. Response structure:"
            jq 'del(.response)' /tmp/response.json
            echo "Response text, if any:"
            jq -r '.response // "<empty>"' /tmp/response.json
            exit 1
          }

          jq -e '
            type == "object" and
            (.quote | type == "string" and length > 0) and
            (.theme | type == "string" and length > 0) and
            (.engineering_tip | type == "string" and length > 0) and
            (.coding_challenge | type == "string" and length > 0)
          ' daily.json >/dev/null

          jq -S . daily.json > daily.tmp
          mv daily.tmp daily.json

          echo "=== Generated output ==="
          cat daily.json
