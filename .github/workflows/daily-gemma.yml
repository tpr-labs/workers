
name: Daily Gemma 4 AI

on:
  schedule:
    - cron: "0 1 * * *" # Daily at 06:30 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-gemma
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check runner resources
        run: |
          echo "=== CPU ==="
          nproc

          echo "=== Memory ==="
          free -h

          echo "=== Disk before installation ==="
          df -h /

      - name: Install Ollama
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL https://ollama.com/install.sh | sh

          ollama serve > /tmp/ollama.log 2>&1 &

          echo "Waiting for Ollama API..."

          for i in {1..30}; do
            if curl -fsS \
              http://localhost:11434/api/tags \
              >/dev/null 2>&1; then
              echo "Ollama is ready."
              exit_code=0
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "Ollama failed to start."
              cat /tmp/ollama.log
              exit 1
            fi

            sleep 2
          done

      - name: Pull Gemma 4 E2B Q4
        shell: bash
        run: |
          set -euo pipefail

          MODEL="gemma4:e2b-it-q4_K_M"

          echo "Pulling model: $MODEL"
          ollama pull "$MODEL"

          echo "=== Disk after model download ==="
          df -h /

          echo "=== Installed models ==="
          ollama list

      - name: Generate daily insight
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/request.json <<'JSON'
          {
            "model": "gemma4:e2b-it-q4_K_M",
            "prompt": "Generate a concise, original software engineer dashboard insight. Return a JSON object with exactly four non-empty string fields: quote, theme, engineering_tip, coding_challenge. The quote should be motivational but not generic. The theme should be short. The engineering tip should be practical. The coding challenge should be solvable in about 10 minutes. Output valid JSON only.",
            "format": "json",
            "stream": false,
            "options": {
              "temperature": 0.7,
              "num_predict": 300,
              "num_ctx": 2048
            }
          }
          JSON

          echo "=== Sending request to Ollama ==="

          if ! curl -fsS \
            --max-time 600 \
            http://localhost:11434/api/generate \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/request.json \
            -o /tmp/response.json; then

            echo "Ollama API request failed."
            cat /tmp/ollama.log || true
            exit 1
          fi

          echo "=== Response metadata ==="

          jq '{
            error: .error,
            done: .done,
            total_duration: .total_duration,
            eval_count: .eval_count,
            response_type: (.response | type),
            response_length: ((.response // "") | tostring | length)
          }' /tmp/response.json

          # Detect API errors before parsing model output.
          if jq -e '.error != null' \
            /tmp/response.json >/dev/null; then

            echo "Ollama returned an error:"
            jq -r '.error' /tmp/response.json
            exit 1
          fi

          # Parse the generated JSON.
          # Ollama's format=json normally returns JSON text
          # inside the response field.
          if ! jq -e '
            if (.response | type) == "string" then
              .response | fromjson
            elif (.response | type) == "object" then
              .response
            else
              error("Missing or invalid response field")
            end
          ' /tmp/response.json > daily.json; then

            echo "Failed to parse generated JSON."
            echo "=== Raw Ollama response ==="
            jq . /tmp/response.json
            echo "=== Ollama server log ==="
            cat /tmp/ollama.log || true
            exit 1
          fi

          # Validate all required fields.
          if ! jq -e '
            type == "object" and
            (.quote |
              type == "string" and length > 0) and
            (.theme |
              type == "string" and length > 0) and
            (.engineering_tip |
              type == "string" and length > 0) and
            (.coding_challenge |
              type == "string" and length > 0)
          ' daily.json >/dev/null; then

            echo "Generated JSON is missing required fields."
            cat daily.json
            exit 1
          fi

          # Normalize JSON formatting.
          jq -S . daily.json > daily.tmp
          mv daily.tmp daily.json

          echo "=== Generated daily insight ==="
          cat daily.json

      - name: Commit generated output
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add daily.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update daily Gemma insight"

          git push

      - name: Final resource report
        if: always()
        run: |
          echo "=== Final disk usage ==="
          df -h /

          echo "=== Memory ==="
          free -h
