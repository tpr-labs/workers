name: Track Bangalore Gold Price

on:
  schedule:
    # 07:15 UTC = 12:45 IST every day
    - cron: '15 7 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Execute scraper script
        run: python fetch_gold_price.py

      - name: Commit and push updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bangalore_gold_prices.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update daily Bangalore gold rates [skip ci]" && git push)
