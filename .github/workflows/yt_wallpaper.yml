name: Generate YouTube Lockscreen

on:
  schedule:
    - cron: '30 1-17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-wallpaper:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Run script to create wallpaper
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: python generate_yt_wallpaper.py

      - name: Commit and push image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily_lockscreen.png
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update YouTube sub count lockscreen [skip ci]" && git push)
